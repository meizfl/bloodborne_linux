name: Shared launcher
on:
  push:
    paths: ['launcher/**', 'scripts/**', 'packaging/**', 'src/**', 'gpu/**', 'build.sh', 'tests/test_launcher_platform.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'scripts/**', 'packaging/**', 'src/**', 'gpu/**', 'build.sh', 'tests/test_launcher_platform.py', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb clang lld
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r packaging/launcher-requirements.txt
      - name: Build launcher bootloader with Clang
        shell: bash
        env:
          CC: clang
          CXX: clang++
          LDFLAGS: -fuse-ld=lld
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
          PYINSTALLER_BOOTLOADER_WAF_ARGS: --clang
        run: python -m pip install --force-reinstall --no-cache-dir --no-binary=PyInstaller PyInstaller==6.16.0
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/test_launcher.py
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python packaging/test_launcher.py
      - name: Linux start tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p "test_linux*.py"
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python launcher/bloodborne_launcher.py --smoke-test
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        run: python launcher/bloodborne_launcher.py --smoke-test
      - name: Build and check Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_launcher.py --check --ui-check
      - name: Build and check Windows package
        if: runner.os == 'Windows'
        run: python packaging/build_launcher.py --check --ui-check
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: dist/launcher/BloodborneLauncher-*.zip

  debian11:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build single-file launcher and native glibc 2.31 runtime
        run: python3 packaging/linux/build.py --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: bloodborne-linux-glibc231
          path: |
            dist/debian11/BloodborneLauncher
            dist/debian11/game_runtime/
