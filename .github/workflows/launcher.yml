name: Shared launcher
on:
  push:
    paths: ['launcher/**', 'scripts/**', 'packaging/build_launcher.py', 'packaging/launcher-requirements.txt', 'tests/test_launcher_platform.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'scripts/**', 'packaging/build_launcher.py', 'packaging/launcher-requirements.txt', 'tests/test_launcher_platform.py', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r packaging/launcher-requirements.txt
      - run: python -m unittest discover -s tests -p "test_launcher_*.py"
      - name: Linux start tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p "test_linux*.py"
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python launcher/bloodborne_launcher.py --smoke-test
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        run: python launcher/bloodborne_launcher.py --smoke-test
      - name: Build and check Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_launcher.py --check --ui-check
      - name: Build and check Windows package
        if: runner.os == 'Windows'
        run: python packaging/build_launcher.py --check --ui-check
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: dist/launcher/BloodborneLauncher-*.zip
